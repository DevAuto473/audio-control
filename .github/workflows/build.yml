name: build
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p boost_core --release
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: audio-boost-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y git gcc gcc-c++ make rust cargo nodejs npm rpm-build webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel file
      - uses: actions/checkout@v4
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build --bundles rpm
      - uses: actions/upload-artifact@v4
        with:
          name: audio-boost-fedora-rpm
          path: target/release/bundle/rpm/*.rpm
