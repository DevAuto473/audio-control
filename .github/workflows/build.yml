name: build
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p boost_core --release
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build --bundles nsis
      - name: Name the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1) dist/AudioBoost-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y git gcc gcc-c++ make rust cargo nodejs npm rpm-build webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel file
      - uses: actions/checkout@v4
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build --bundles rpm
      - run: mkdir dist && cp "$(ls target/release/bundle/rpm/*.rpm | head -n1)" dist/AudioBoost-Fedora.x86_64.rpm
      - uses: actions/upload-artifact@v4
        with: { name: fedora, path: dist/* }
  release:
    needs: [test, windows, fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Audio Boost (latest)
          make_latest: true
          files: dist/*
