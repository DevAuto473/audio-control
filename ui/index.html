<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Boost</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Audio Boost</h1>
      <label class="switch" data-i18n-title="power">
        <input type="checkbox" id="power" checked>
        <span></span>
      </label>
    </header>

    <section class="readout"><span id="pct">100</span><small>%</small></section>

    <section class="slider">
      <button class="step" id="down" aria-label="-">&minus;</button>
      <input type="range" id="vol" min="0" max="300" step="1" value="100">
      <button class="step" id="up" aria-label="+">+</button>
    </section>

    <section class="presets" id="presets">
      <button data-v="50">50</button>
      <button data-v="100">100</button>
      <button data-v="150">150</button>
      <button data-v="200">200</button>
      <button data-v="300">300</button>
    </section>

    <section class="row">
      <button id="mute" class="btn" data-i18n="mute">Mute</button>
      <select id="output" aria-label="Output"></select>
    </section>

    <section class="opts">
      <label class="check"><input type="checkbox" id="autostart"><span></span><em data-i18n="autostart">Start with system</em></label>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="ar">العربية</option>
      </select>
    </section>

    <p id="status" class="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
