[package]
name = "audio-boost"
version = "0.1.0"
edition = "2021"
description = "Simple system volume booster with a built-in limiter"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
boost_core = { path = "../core" }
